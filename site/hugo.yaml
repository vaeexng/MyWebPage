  # projects
  projects:
    enable: true
    title: "프로젝트"
    items:
      - title: Hugo 개인 소개 웹사이트
        content: |-
          Hugo 테마를 활용해 개인 소개 웹사이트를 제작했습니다. 메인 화면과 자기소개, 프로젝트 소개 등을 수정하고 GitHub 저장소에 업로드했습니다. 또한 GitHub Actions를 이용해 코드를 push하면 웹사이트가 자동으로 배포되도록 설정했습니다. 이를 통해 Hugo를 이용한 웹사이트 제작과 Git 버전 관리, 자동 배포 과정을 익혔습니다.
        image: /images/projects/my-site.png
        featured:
          name: 사이트 보기
          link: https://vaeexng.github.io/MyWebPage/
        badges:
          - "Hugo"
          - "GitHub Actions"
          - "GitHub Pages"
        links:
          - icon: fab fa-github
            url: https://github.com/vaeexng/MyWebPage
          

      - title: TMDB Movie Website
        content: |-
          Vue 기반 TMDB 프로젝트를 두 가지 방식으로 배포하는 실습을 진행했습니다.
          첫 번째는 npm run build로 빌드한 결과물을 GitHub Pages에 배포했고, 두 번째는 GitHub Actions를 이용해 배포 과정을 자동화했습니다. 두 가지 방식을 비교하며 Vue 프로젝트의 빌드와 배포 과정을 익혔습니다.
        image: /images/projects/movie-lab.png
        featured:
          name: Movie Website
          link: https://Vaeexng.github.io/movie-lab/
        badges:
          - "Vue"
          - "GitHub Pages"
          - "GitHub Actions"
        links:
          - icon: fab fa-github
            url: https://github.com/vaeexng/movie-lab
          - icon: fab fa-github
            url: https://github.com/vaeexng/movie-lab-actions

