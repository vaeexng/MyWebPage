baseURL: "https://vaeexng.github.io/MyWebPage/"
languageCode: "ko"
title: "Hugo Profile"


# Multilingual configuration
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: "한국어"
    languageCode: "ko"
    weight: 1
    contentDir: "content"
    
outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

#services:
  #googleAnalytics:
    #id: G-MEASUREMENT_ID
  #disqus:
    #shortname: your-disqus-shortname

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true



params:
  title: "Hugo Profile"
  description: "배해인의 개인 소개 및 웹 개발 포트폴리오 사이트입니다."
  # staticPath: ""  # The path to serve the static files from
  favicon: "/fav.png"

  # Whether to serve bootstrap css and js files from CDN or not. Can be set to true, "css" or "js" to choose between
  # serving both, only the css, or only the js files through the CDN. Any other value will make so that CDN is not used.
  # Note the lack of "" in true, it should be of boolean type.
  useBootstrapCDN: false

  # If you want to load dynamically responsive images from Cloudinary
  # This requires your images to be uploaded + hosted on Cloudinary
  # Uncomment and change YOUR_CLOUD_NAME to the Cloud Name in your Cloudinary console
  # cloudinary_cloud_name: "YOUR_CLOUD_NAME"

  # Whether to add mathjax support on all pages. Alternatively, you can opt-in per page by adding `mathjax: true` in the frontmatter.
  mathjax: false

  # Whether the fade animations on the home page will be enabled
  animate: true

  theme:
    # disableThemeToggle: true
    # defaultTheme: "light" # dark

  font:
    fontSize: 1rem # default: 1rem
    fontWeight: 400 # default: 400
    lineHeight: 1.5 # default: 1.5
    textAlign: left # default: left

  # color preference
  # When using hex codes for colors, quotations must be used along with the # sign
  # color:
  #   textColor: "#343a40"
  #   secondaryTextColor: "#6c757d"
  #   textLinkColor: "#007bff"
  #   backgroundColor: "#eaedf0"
  #   secondaryBackgroundColor: "#64ffda1a"
  #   primaryColor: "#007bff"
  #   secondaryColor: "#f8f9fa"

  #   darkmode:
  #     textColor: "#e4e6eb"
  #     secondaryTextColor: "#b0b3b8"
  #     textLinkColor: "#ffffff"
  #     backgroundColor: "#18191a"
  #     secondaryBackgroundColor: "#212529"
  #     primaryColor: "#ffffff"
  #     secondaryColor: "#212529"

  # If you want to customize the menu, you can change it here
  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    # brandLogo: "/logo.png" # Logo for the brand | default is the favicon variable
    # showBrandLogo: false # Show brand logo in nav bar | default is true
    brandName: "배해인 포트폴리오" # Brand name for the brand | default is the title variable
    disableSearch: false
    # searchPlaceholder: "Search"
    stickyNavBar:
      enable : true
      showOnScrollUp : true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "안녕하세요 저는"
    title: "배해인 입니다"
    subtitle: "웹 개발 공부"
    content: "컴퓨터인공지능학과 학생이고, 웹 개발을 공부하고 있습니다. 지금은 간단한 사이트를 직접 만들고 배포하는 연습을 하고 있습니다."
    image: /images/hero.svg
    bottomImage:
      enable: true
    # roundImage: true # Make hero image circular | default false
    button:
      enable: true
      name: "자기소개 보기"
      url: "#about"
      download: false
      newPage: false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/vaeexng

  # About
  about:
    enable: true
    title: "자기소개"
    image: "/images/me.png"
    content: |-
      웹 개발에 관심이 있어서 공부하고 있습니다. 웹사이트로 정보를 전달하고 사람들이 편하게 쓸 수 있는 서비스를 직접 만든다는 점이 흥미로웠습니다. 특히 아이디어가 실제 화면과 기능으로 나오는 과정이 재미있었습니다.

      목표는 웹사이트를 처음부터 끝까지 혼자 만들어 보는 것입니다. 그래서 HTML, CSS, JavaScript 기초를 꾸준히 공부하고, 배운 내용을 작은 프로젝트에 적용해 볼 계획입니다. 프로젝트를 하다가 생기는 오류도 스스로 찾아 해결하는 연습을 하고 있습니다.

      Git과 GitHub는 이 사이트를 만들면서 커밋과 배포에 직접 써 보고 있습니다.
    skills:
      enable: true
      title: "수업과 개인 학습에서 쏘 본 기술과 도구:"
      items:
        - "Java"
        - "C"
        - "Linux 기본 명령어"
        - "Vs Code"
        - "Git / GitHub"
        - "Hugo"
        - "GitHub Pages"

  # Experience
  experience:
    enable: true
    title: "학습 이력"
    items:
      - company: "MergeSort"
        jobs:
          - name: "알고리즘 수업 과제 (C++)"
            date: "2026년 10월 11일"
            content: |
              수업에서 배운 분할 정복 방식을 C++로 구현했습니다.

              - 배열을 반으로 나누고, 각 부분 배열의 원소를 비교해 작은 값부터 합쳤습니다.
              - 임시 배열을 활용해 정렬 결과를 저장하고, 원래 배열에 다시 반영했습니다.
              - 원소 간 비교 횟수를 계산하도록 구현했습니다.

      - company: "Quick Sort"
        jobs:
          - name: "알고리즘 수업 과제 (C++)"
            date: "2026년 10월 11일"
            info:
              content: 원소를 교환하는 횟수를 카운트하여 출력하도록 구현했습니다.
            content: |
              기준 원소(Pivot)를 중심으로 배열을 나누는 방식을 구현했습니다.

              - 마지막 원소를 기준값으로 선택하고, 작은 값과 큰 값으로 나누었습니다.
              - 기준값을 알맞은 위치에 배치한 뒤 양쪽 배열에 재귀적으로 정렬을 적용했습니다.
              - 원소의 교환 횟수를 계산하도록 구현했습니다. 

      - company: "File System"
        jobs: 
        - name: "Linux 수업 과제"
          date: "2026년 10월 12일"
          content: |
            Linux에서 디렉터리와 파일을 생성하고 이동 및 복사하는 실습을 진행했습니다.

            - 사용자 디렉터리 아래 hw2를 만들고, 그 안에 dir1부터 dir10까지 생성했습니다.
            - 텍스트 파일을 내려받아 dir8로 이동하고 복사본을 dir10에 두고 hw2.txt로 이름을 변경했습니다.
            - cd 명령어를 사용하지 않고 절대 경로와 상대 경로를 활용해 작업을 수행했습니다.
            - 명령어 사용을 최소화하면서 디렉터리 생성 파일 이동 및 복사 방법을 익혔습니다.

      - company: "File Link"
        jobs:
        - name: "Linux 수업 과제"
          date: "2026년 10월 22일"
          content: |
            Linux 환경에서 하드 링크와 심볼릭 링크의 생성 및 동작 차이를 확인하는 실습을 진행했습니다.

            - 텍스트 파일을 2개 생성하고 하드링크와 심볼릭링크를 만들었습니다.
            - stat 명령어로 파일의 inode 번호와 정보를 확인했습니다.
            - 원본 파일의 내용을 수정하거나 삭제하면서 각 링크의 동작 변화를 비교했습니다.
            - 파일 수정 및 삭제에 따른 하드 링크와 심볼릭 링크의 차이를 직접 확인했습니다.


  # Education
  education:
    enable: true
    title: "대표 활동"
    index: false
    items:
      - title: "목적과 역할"
        school:
          name: "Hugo 개인 소개 웹사이트"
        date: "2026년 10월 13일 ~ 11월 7일"
        content: |-
            - 목적: Hugo 테마를 활용해 개인 소개 사이트를 만들고, 웹 사이트를 구성하고 배포하는 과정을 직접 경험하기 위해 시작했습니다.
            - 역할: 제공된 테마를 살펴보고 나에게 맞게 수정할 부분을 정했으며, 자기소개와 활동 내용을 작성하고 웹사이트 설정 및 배포도 직접 진행했습니다.
            - 상태: 진행 중입니다.
      - title: "수행 과정"
        school:
          name: "Hugo 개인 소개 웹사이트"
        date: "2026년 10월 13일 ~ 11월 7일"
        content: |-
          - 테마 ZIP 파일을 받아 GitHub 저장소에 업로드하고, 이후 GitHub Actions를 이용해 코드를 수정하고 push하면 웹사이트가 자동으로 배포되도록 설정했습니다. 
          - 사이트에 들어갈 소개 문구와 설정을 수정하고 변경할 때마다 Git에 기록했습니다.
          - Hugo Profile은 자기소개, 기술, 프로젝트 등을 한 페이지에 나누어 보여줄 수 있어 개인 소개 사이트를 만들기에 적합하다고 생각해 선택했습니다.

