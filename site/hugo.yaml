  # projects
  projects:
    enable: true
    # title: "Custom Name"
    items:
      - title: Hugo 개인 소개 웹사이트
        content: |-
          기간: 2026년 10월 13일 ~ 11월 7일

          목적: Hugo 테마를 활용해 개인 소개 사이트를 만들고, 웹사이트를 구성하고 배포하는 과정을 직접 경험하기 위해 시작했습니다.

          역할: 제공된 테마를 살펴보고 나에게 맞게 수정할 부분을 정했으며, 자기소개와 활동 내용을 작성하고 웹사이트 설정 및 배포도 직접 진했하였습니다.

          과정: 테마 ZIP 파일을 받아 GitHub 저장소에 업로드하고, 이후 GitHub Actions를 이용해 코드를 수정하고 push하면 웹사이트가 자동으로 배포되도록 설정했습니다. 현재는 메인 화면과 자기소개 내용을 수정하며 사이트를 완성해 나가고 있습니다.

          결과: 수정한 내용을 GitHub에 push한 뒤 실제 공개 사이트에도 반영되는 것을 확인했습니다. 이 과정을 통해 Git을 이용한 버전 관리와 GitHub Pages 배포 방법을 익힐 수 있었습니다.

          다음 개선: 모바일과 태블릿에서도 보기 편하도록 화면을 다듬고, 디자인과 기능을 조금씩 개선해 나갈 계획입니다.
        image: /images/projects/profile.png
        featured:
          name: 사이트 보기
          link: https://vaeexng.github.io/MyWebPage/
        badges:
          - "Hugo"
          - "GitHub Actions"
          - "GitHub Pages"
        links:
          - icon: fab fa-github
            url: https://github.com/vaeexng/MyWebPage
          

      - title: Image Converter
        content: A web app to convert image to pdf, png to jpg, png to jpg and png to webp without database using django.
        image: /images/projects/converter.jpg
        featured:
